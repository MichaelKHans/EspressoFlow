<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">

  <title>Flowbean – Gear Billed-Scanner & Audit</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: #FFFDF9;
      --espresso: #2C2018;
      --terracotta: #C26D52;
      --border: #D0BDAA;
      --text: #2C2018;
      --muted: #7A6E65;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .header h1 {
      font-size: 22px;
      color: var(--espresso);
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      color: var(--espresso);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #F4EFEA;
      border-color: var(--terracotta);
    }
    .btn.active {
      background: var(--espresso);
      color: white;
      border-color: var(--espresso);
    }
    .btn-copy {
      background: var(--terracotta);
      color: white;
      border-color: var(--terracotta);
    }
    .btn-copy:hover {
      background: #A85A42;
    }
    .stats {
      font-size: 13px;
      font-family: monospace;
      color: var(--espresso);
      padding: 6px 12px;
      background: #FAF7F2;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .card.status-correct {
      border: 2px solid #10B981;
      background: #F0FDF4;
    }
    .card.status-wrong {
      border: 2px solid #EF4444;
      background: #FEF2F2;
    }
    .img-box {
      width: 100%;
      height: 180px;
      background: #FAF7F2;
      border-radius: 10px;
      border: 1px solid rgba(208, 189, 170, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .img-box img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    .meta {
      margin-bottom: 12px;
    }
    .meta .brand {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--terracotta);
      font-family: monospace;
    }
    .meta .title {
      font-size: 14px;
      font-weight: 700;
      color: var(--espresso);
      margin: 2px 0;
      line-height: 1.25;
    }
    .meta .sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .meta .path {
      font-size: 9px;
      color: #A6998E;
      font-family: monospace;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .act-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: white;
    }
    .act-btn.correct:hover, .card.status-correct .act-btn.correct {
      background: #10B981;
      color: white;
      border-color: #10B981;
    }
    .act-btn.wrong:hover, .card.status-wrong .act-btn.wrong {
      background: #EF4444;
      color: white;
      border-color: #EF4444;
    }
    .search-input {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      min-width: 220px;
    }
  </style>
</head>

oseneck Variable PID", "image": "/images/gear/kettles/bonavita-variable-1l.webp"}, {"id": "kettle-cosori-smart-gooseneck", "name": "Cosori Smart Electric Gooseneck", "brand": "Cosori", "category": "kettle", "subCategory": "Smart Gooseneck Variable PID", "image": "/images/gear/kettles/cosori-smart-gooseneck.webp"}, {"id": "kettle-wilfa-svart-pour", "name": "Wilfa Svart Pour Gooseneck", "brand": "Wilfa", "category": "kettle", "subCategory": "Precision Gooseneck Variable Kettle", "image": "/images/gear/kettles/wilfa-svart-pour.webp"}];
    let currentCategory = 'all';
    
    function loadSavedStatus() {
      try {
        const raw = localStorage.getItem('flowbean_audit_status');
        return raw ? JSON.parse(raw) : {};
      } catch { return {}; }
    }
    
    function saveStatus(auditState) {
      localStorage.setItem('flowbean_audit_status', JSON.stringify(auditState));
      updateStats();
    }
    
    let auditState = loadSavedStatus();

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filters .btn').forEach(b => {
        b.classList.toggle('active', b.innerText.toLowerCase().includes(cat === 'all' ? 'alle' : cat === 'grinder' ? 'kværne' : cat === 'machine' ? 'maskiner' : cat === 'brewer' ? 'bryggere' : 'kedler'));
      });
      renderGrid();
    }

    function markItem(id, status) {
      if (auditState[id] === status) {
        delete auditState[id];
      } else {
        auditState[id] = status;
      }
      saveStatus(auditState);
      renderGrid();
    }

    function updateStats() {
      let okCount = 0;
      let wrongCount = 0;
      for (const id in auditState) {
        if (auditState[id] === 'correct') okCount++;
        if (auditState[id] === 'wrong') wrongCount++;
      }
      document.getElementById('stats').innerText = `${okCount} ✅ Godkendt • ${wrongCount} ❌ Forkert • ${items.length - okCount - wrongCount} Uafklaret`;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const q = document.getElementById('search').value.toLowerCase().trim();
      
      const filtered = items.filter(it => {
        if (currentCategory !== 'all' && it.category !== currentCategory) return false;
        if (q && !it.name.toLowerCase().includes(q) && !it.brand.toLowerCase().includes(q)) return false;
        return true;
      });

      grid.innerHTML = filtered.map(it => {
        const st = auditState[it.id] || '';
        const stClass = st === 'correct' ? 'status-correct' : st === 'wrong' ? 'status-wrong' : '';
        return `
          <div class="card ${stClass}" id="card-${it.id}">
            <div class="img-box">
              <img src="${it.image}" alt="${it.name}" onerror="this.src='/images/gear/grinders/baratza-esp.webp'">
            </div>
            <div class="meta">
              <div class="brand">${it.brand || it.category}</div>
              <div class="title">${it.name}</div>
              <div class="sub">${it.subCategory || ''}</div>
              <div class="path">${it.image}</div>
            </div>
            <div class="actions">
              <button class="act-btn correct" onclick="markItem('${it.id}', 'correct')">
                ${st === 'correct' ? '✅ Godkendt' : '✓ OK'}
              </button>
              <button class="act-btn wrong" onclick="markItem('${it.id}', 'wrong')">
                ${st === 'wrong' ? '❌ Er Forkert' : '✗ Forkert'}
              </button>
            </div>
          </div>
        `;
      }).join('');
      
      updateStats();
    }

    function copyReport() {
      const wrongs = [];
      for (const it of items) {
        if (auditState[it.id] === 'wrong') {
          wrongs.push(`- [ ] **${it.name}** (${it.brand}): ${it.image}`);
        }
      }
      if (wrongs.length === 0) {
        alert('Du har ikke markeret nogen udstyr som forkerte endnu! Klik [❌ Forkert] på dem, der skal skiftes.');
        return;
      }
      const report = "### 📋 GEAR AUDIT - FORKERTE BILLEDER DER SKAL RETTES:\n" + wrongs.join('\n');
      navigator.clipboard.writeText(report).then(() => {
        alert('Kopieret til udklipsholderen! Indsæt teksten direkte i chatten til Anti.');
      }).catch(() => {
        prompt('Kopiér herfra:', report);
      });
    }

    renderGrid();
  </script>
